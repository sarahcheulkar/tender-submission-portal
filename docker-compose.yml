version: "3.8"

services:
  tender-portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: sarahcheulkar/tender-portal:1.0.0
    container_name: tender-portal-container
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - SPRING_PROFILES_ACTIVE=production
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped
