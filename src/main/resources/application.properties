# Server Port (default 8082 to avoid conflicts with 8080/8081)
server.port=${PORT:8082}

# Application Metadata
spring.application.name=tender-submission-portal
info.app.name=Ansible-Provisioned Tender Submission Portal
info.app.student=Sarah Cheulkar (23102C0060)
info.app.version=1.0.0
info.app.course=DevOps Major Project

# Database: Embedded H2 for zero-configuration execution
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:tender_portal;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Spring Boot Actuator Configuration (Health Check for Docker & Ansible)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.tenderportal=INFO
